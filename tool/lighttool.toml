[tool]
id = "com.sanntid.lp3"
label = "Sanntid"
versionCode = 1
versionName = "1.0.0"
orientation = "portrait"

# ACCESS_FINE_LOCATION drives "Nær meg" (nearby stops). LightOS does not currently grant it
# in-app — see the "Nær meg" section of the README for the one-time adb command. Everything
# else in the app works without it. COARSE is declared alongside FINE so the runtime prompt
# can offer the approximate option on any LightOS that does start granting these.
permissions = [
    "android.permission.INTERNET",
    "android.permission.ACCESS_FINE_LOCATION",
    "android.permission.ACCESS_COARSE_LOCATION",
]

# change if you run this on the emulator!
# serverPackage = "com.thelightphone.sdk.emulator"
serverPackage = "com.lightos"
